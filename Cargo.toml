[workspace]
members = [
    ".",
    ".xtask",
]


[workspace.package]
edition = "2024"
rust-version = "1.99.0"
authors = ["Jan Roman Cisowski „j-Cis” <code@cisowscy.com>"]
repository = "https://github.com/Cisowscy/kto-jest-kim"


[package]
name = "kto-jest-kim"
version = "0.1.0-dev.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A simple application to manage and visualize relationships between people."
license = "Unlicense"
repository.workspace = true
resolver = "3"


[lib]
name = "kim"
path = "src/core.rs"
crate-type = ["cdylib", "rlib"]


[profile.release]
opt-level = 2

[profile.release.package."*"]
opt-level = 2

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
	"Location",
] }


[dependencies]
egui-knex = "0.1.0-dev.7"


[lints.rust]
#dead_code = "allow"
#unsafe_code = "forbid"

[lints.clippy]
#bool_comparison = "allow"
#too_many_arguments = "allow"
